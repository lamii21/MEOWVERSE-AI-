name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: meowverse
          POSTGRES_PASSWORD: meowverse
          POSTGRES_DB: meowverse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U meowverse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://meowverse:meowverse@localhost:5432/meowverse
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: alembic upgrade head
      - run: pytest

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Builds the actual production images (Phase 17) — catches
      # Dockerfile/dependency-installation breakage that `ruff`/`pytest`
      # running directly on the runner can't see, since those never
      # exercise the container build at all. Doesn't run either
      # container (that needs a real Postgres/Redis pair and secrets;
      # see docker-compose.prod.yml for local verification of that).
      - name: Build backend image (with ML dependencies)
        run: docker build -t meowverse-backend:ci ./backend
      - name: Build frontend image (production target)
        run: docker build -t meowverse-frontend:ci --target runner ./frontend
